name: Separate FOI site Internet Archive snapshots

on:
  schedule:
    # Weekly complete Wayback URL inventory; never contacts origin sites.
    - cron: "17 5 * * 2"
  workflow_dispatch:
    inputs:
      capture_mode:
        description: URL inventory or every historical capture
        required: true
        default: url_index
        type: choice
        options:
          - url_index
          - all_captures
      page_size:
        description: CDX rows per page
        required: true
        default: "1000"
        type: string
      max_pages:
        description: Fail-closed resume-key chunk ceiling; never partial success
        required: true
        default: "1000"
        type: string
      max_runtime_seconds:
        description: Whole-pattern deadline; named-site runs may use up to 7200 seconds
        required: true
        default: "1800"
        type: string
      max_stall_seconds:
        description: Fail closed after this many seconds without a new checkpoint
        required: true
        default: "900"
        type: string
      resume_run_id:
        description: Optional prior run containing compatible site checkpoints
        required: false
        default: ""
        type: string
      site_id:
        description: Optional configured site id for a bounded targeted retry
        required: false
        default: ""
        type: string
      site_ids:
        description: Optional comma-separated configured ids for one bounded targeted matrix
        required: false
        default: ""
        type: string
      from_timestamp:
        description: Optional four-digit partition start year
        required: false
        default: ""
        type: string
      to_timestamp:
        description: Optional four-digit partition end year
        required: false
        default: ""
        type: string
      include_urlkey:
        description: Include urlkey for complete-only partition merging
        required: false
        default: false
        type: boolean

permissions:
  actions: read # Download retained artifacts from an explicitly selected prior run.
  contents: read

concurrency:
  group: separate-foi-site-internet-archive
  cancel-in-progress: false

jobs:
  enumerate:
    name: Enumerate archive sites
    runs-on: ubuntu-latest
    outputs:
      sites: ${{ steps.sites.outputs.sites }}
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@94527f2e458b27549849d47d273a16bec83a01e9 # v7
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
      - run: uv sync --extra dev --frozen
      - name: Validate normalized source graph
        run: uv run python scripts/build_archive_source_graph.py --check
      - id: sites
        env:
          TARGET_SITE_ID: ${{ inputs.site_id || '' }}
          TARGET_SITE_IDS: ${{ inputs.site_ids || '' }}
        run: |
          uv run python - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          import os
          from fyi_archive.internet_archive_sites import internet_archive_matrix
          site_id = os.environ["TARGET_SITE_ID"] or None
          raw_site_ids = os.environ["TARGET_SITE_IDS"]
          site_ids = tuple(value.strip() for value in raw_site_ids.split(",") if value.strip())
          print("sites=" + json.dumps(
              internet_archive_matrix(
                  site_id=site_id,
                  site_ids=site_ids if raw_site_ids else None,
              ),
              separators=(",", ":"),
          ))
          PY

  snapshot:
    name: Snapshot ${{ matrix.site.site_id }}
    needs: enumerate
    runs-on: ubuntu-latest
    timeout-minutes: 135
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        site: ${{ fromJSON(needs.enumerate.outputs.sites) }}
    env:
      CAPTURE_MODE: ${{ inputs.capture_mode || 'url_index' }}
      MAX_PAGES: ${{ inputs.max_pages || '1000' }}
      MAX_RUNTIME_SECONDS: ${{ inputs.max_runtime_seconds || '1800' }}
      MAX_STALL_SECONDS: ${{ inputs.max_stall_seconds || '900' }}
      PAGE_SIZE: ${{ inputs.page_size || '1000' }}
      REQUESTED_RESUME_RUN_ID: ${{ inputs.resume_run_id || '' }}
      TARGET_SITE_ID: ${{ inputs.site_id || '' }}
      TARGET_SITE_IDS: ${{ inputs.site_ids || '' }}
      FROM_TIMESTAMP: ${{ inputs.from_timestamp || '' }}
      TO_TIMESTAMP: ${{ inputs.to_timestamp || '' }}
      INCLUDE_URLKEY: ${{ inputs.include_urlkey || false }}
      SITE_COUNTRY: ${{ matrix.site.country }}
      SITE_ID: ${{ matrix.site.id }}
      SITE_KIND: ${{ matrix.site.kind }}
      URL_PATTERNS: ${{ toJSON(matrix.site.url_patterns) }}
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@94527f2e458b27549849d47d273a16bec83a01e9 # v7
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
      - run: uv sync --extra dev --frozen
      - name: Validate bounded acquisition settings
        run: |
          set -euo pipefail
          case "$PAGE_SIZE" in ''|*[!0-9]*) exit 1;; esac
          case "$MAX_PAGES" in ''|*[!0-9]*) exit 1;; esac
          case "$MAX_RUNTIME_SECONDS" in ''|*[!0-9]*) exit 1;; esac
          case "$MAX_STALL_SECONDS" in ''|*[!0-9]*) exit 1;; esac
          test "$PAGE_SIZE" -ge 1 && test "$PAGE_SIZE" -le 5000
          test "$MAX_PAGES" -ge 1 && test "$MAX_PAGES" -le 10000
          test "$MAX_RUNTIME_SECONDS" -ge 30 && test "$MAX_RUNTIME_SECONDS" -le 7200
          test "$MAX_STALL_SECONDS" -ge 60 && test "$MAX_STALL_SECONDS" -le 2400
          test "$MAX_STALL_SECONDS" -le "$MAX_RUNTIME_SECONDS"
          if [ "$MAX_RUNTIME_SECONDS" -gt 2400 ]; then
            test -n "${TARGET_SITE_ID}${TARGET_SITE_IDS}"
          fi
          case "$CAPTURE_MODE" in url_index|all_captures) ;; *) exit 1;; esac
          if [ -n "$REQUESTED_RESUME_RUN_ID" ]; then
            [[ "$REQUESTED_RESUME_RUN_ID" =~ ^[0-9]+$ ]]
          fi
          if [ -n "$FROM_TIMESTAMP" ]; then [[ "$FROM_TIMESTAMP" =~ ^[0-9]{4}$ ]]; fi
          if [ -n "$TO_TIMESTAMP" ]; then [[ "$TO_TIMESTAMP" =~ ^[0-9]{4}$ ]]; fi
          if [ -n "$FROM_TIMESTAMP" ] && [ -n "$TO_TIMESTAMP" ]; then
            test "$FROM_TIMESTAMP" -le "$TO_TIMESTAMP"
          fi
      - name: Resolve prior site checkpoint
        id: resume
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          root=".tmp/sites/$SITE_ID"
          restore=".tmp/restore-$SITE_ID"
          mkdir -p "$root" "$restore"
          if [ -n "$REQUESTED_RESUME_RUN_ID" ]; then
            candidates=("$REQUESTED_RESUME_RUN_ID")
            reason="explicit-resume-run"
          else
            mapfile -t candidates < <(
              gh run list --repo "$GITHUB_REPOSITORY" \
                --workflow foi_site_internet_archive.yml \
                --branch "$GITHUB_REF_NAME" \
                --status completed \
                --limit 50 \
                --json databaseId \
                --jq '.[].databaseId'
            )
            reason="latest-compatible-checkpoint"
          fi
          for run_id in "${candidates[@]}"; do
            candidate="$restore/$run_id"
            rm -rf "$candidate"
            mkdir -p "$candidate"
            if ! gh run download "$run_id" \
              --repo "$GITHUB_REPOSITORY" \
              --name "foi-site-wayback-$SITE_ID-$run_id" \
              --dir "$candidate" >/dev/null 2>&1; then
              continue
            fi
            manifest="$(find "$candidate" -type f -name manifest.json -print -quit)"
            [ -n "$manifest" ] || continue
            if ! manifest_state="$(uv run python -c '
          import json
          import sys

          with open(sys.argv[1], encoding="utf-8") as handle:
              p = json.load(handle)
          print("capture-match=" + str(p.get("capture_mode") == sys.argv[2]).lower())
          print("complete=" + str(p.get("complete") is True).lower())
          print("pagination-match=" + str(p.get("pagination", {}).get("mode") == "resume_key").lower())
          ' "$manifest" "$CAPTURE_MODE")"; then
              continue
            fi
            grep -qx "capture-match=true" <<< "$manifest_state" || continue
            grep -qx "pagination-match=true" <<< "$manifest_state" || continue
            if grep -qx "complete=true" <<< "$manifest_state"; then
              [ -z "$REQUESTED_RESUME_RUN_ID" ] || continue
              echo "run_id=" >> "$GITHUB_OUTPUT"
              echo "reason=latest-complete-refresh" >> "$GITHUB_OUTPUT"
              echo "Latest compatible $SITE_ID inventory is complete; refreshing from scratch"
              exit 0
            fi
            checkpoint="$(find "$candidate" -type f -path '*/cdx-*.pages/checkpoint.json' -print -quit)"
            [ -n "$checkpoint" ] || continue
            cp -a "$candidate/." "$root/"
            echo "run_id=$run_id" >> "$GITHUB_OUTPUT"
            echo "reason=$reason" >> "$GITHUB_OUTPUT"
            echo "Restored $SITE_ID checkpoint from run $run_id ($reason)"
            exit 0
          done
          if [ -n "$REQUESTED_RESUME_RUN_ID" ]; then
            echo "Explicit resume run has no compatible checkpoint for $SITE_ID" >&2
            exit 1
          fi
          echo "run_id=" >> "$GITHUB_OUTPUT"
          echo "reason=no-compatible-checkpoint" >> "$GITHUB_OUTPUT"
          echo "No compatible prior checkpoint found for $SITE_ID"
      - name: Build complete cumulative Wayback snapshot
        env:
          RESUME_SOURCE_RUN_ID: ${{ steps.resume.outputs.run_id }}
          RESUME_REASON: ${{ steps.resume.outputs.reason }}
        run: |
          set -euo pipefail
          root=".tmp/sites/$SITE_ID"
          mkdir -p "$root"
          uv run python - "$root" <<'PY'
          import hashlib
          import json
          import os
          import subprocess
          import sys
          from datetime import datetime, timezone
          from pathlib import Path
          from urllib.parse import urlsplit

          root = Path(sys.argv[1])
          patterns = json.loads(os.environ["URL_PATTERNS"])
          artifacts = []
          failures = []
          resumed = bool(os.environ["RESUME_SOURCE_RUN_ID"])
          for index, pattern in enumerate(patterns):
              output = root / f"cdx-{index:02d}.json"
              evidence = root / f"retrieval-{index:02d}.json"
              host = urlsplit(f"https://{pattern}").hostname
              if not host:
                  raise SystemExit(f"invalid host-relative pattern: {pattern}")
              command = [
                  sys.executable,
                  "scripts/fetch_complete_internet_archive_cdx.py",
                  "--url-pattern", pattern,
                  "--instance-id", os.environ["SITE_ID"],
                  "--host", host,
                  "--capture-mode", os.environ["CAPTURE_MODE"],
                  "--page-size", os.environ["PAGE_SIZE"],
                  "--max-pages", os.environ["MAX_PAGES"],
                  "--max-runtime-seconds", os.environ["MAX_RUNTIME_SECONDS"],
                  "--max-stall-seconds", os.environ["MAX_STALL_SECONDS"],
                  "--output", str(output),
                  "--evidence", str(evidence),
              ]
              if os.environ["FROM_TIMESTAMP"]:
                  command.extend(["--from-timestamp", os.environ["FROM_TIMESTAMP"]])
              if os.environ["TO_TIMESTAMP"]:
                  command.extend(["--to-timestamp", os.environ["TO_TIMESTAMP"]])
              if os.environ["INCLUDE_URLKEY"].lower() == "true":
                  command.append("--include-urlkey")
              if resumed and output.with_name(f"{output.stem}.pages").exists():
                  command.extend([
                      "--resume",
                      "--resume-source-run-id", os.environ["RESUME_SOURCE_RUN_ID"],
                  ])
              process = subprocess.Popen(command)
              while True:
                  try:
                      returncode = process.wait(timeout=60)
                      break
                  except subprocess.TimeoutExpired:
                      checkpoint_path = output.with_name(
                          f"{output.stem}.pages"
                      ) / "checkpoint.json"
                      progress = {
                          "event": "cdx-heartbeat",
                          "site_id": os.environ["SITE_ID"],
                          "pattern_index": index,
                          "process_alive": process.poll() is None,
                      }
                      if checkpoint_path.exists():
                          checkpoint = json.loads(checkpoint_path.read_text(encoding="utf-8"))
                          progress.update({
                              "completed_chunks": checkpoint.get("completed_pages", 0),
                              "record_count": checkpoint.get("record_count", 0),
                          })
                      print(json.dumps(progress, sort_keys=True), flush=True)
              retrieval = json.loads(evidence.read_text(encoding="utf-8"))
              if returncode or retrieval["retrieval_status"] != "complete":
                  failures.append({
                      "pattern": pattern,
                      "returncode": returncode,
                      "retrieval_status": retrieval["retrieval_status"],
                      "failure": retrieval.get("failure"),
                  })
              artifact = {
                  "path": output.name if output.exists() else None,
                  "evidence_path": evidence.name,
                  "url_pattern": pattern,
                  "capture_mode": os.environ["CAPTURE_MODE"],
                  "pagination_complete": retrieval["pagination_complete"],
                  "record_count": retrieval["record_count"],
                  "evidence_sha256": hashlib.sha256(evidence.read_bytes()).hexdigest(),
              }
              if output.exists():
                  artifact["bytes"] = output.stat().st_size
                  artifact["sha256"] = hashlib.sha256(output.read_bytes()).hexdigest()
              artifacts.append(artifact)
          manifest = {
              "schema": "fyi-archive.separate-foi-site-wayback.v3",
              "site_id": os.environ["SITE_ID"],
              "site_kind": os.environ["SITE_KIND"],
              "country": os.environ["SITE_COUNTRY"],
              "generated_at": datetime.now(timezone.utc).isoformat(),
              "source": "https://web.archive.org/cdx/search/cdx",
              "origin_contacted": False,
              "snapshot_semantics": "complete-paginated-cumulative-refresh",
              "resume": {
                  "source_run_id": os.environ["RESUME_SOURCE_RUN_ID"] or None,
                  "reason": os.environ["RESUME_REASON"],
                  "checkpoint_hash_validation": "required-by-fetch-wrapper",
              },
              "pagination": {
                  "mode": "resume_key",
                  "continuation": "showResumeKey/resumeKey",
                  "chunk_limit": int(os.environ["MAX_PAGES"]),
                  "progress_stall_seconds": int(os.environ["MAX_STALL_SECONDS"]),
              },
              "capture_mode": os.environ["CAPTURE_MODE"],
              "complete": not failures and all(
                  artifact["pagination_complete"] for artifact in artifacts
              ),
              "transformation": {
                  "id": "complete-wayback-site-inventory-v3",
                  "collapse": "urlkey" if os.environ["CAPTURE_MODE"] == "url_index" else None,
                  "inference": "none",
              },
              "artifacts": artifacts,
              "failures": failures,
              "durable_handoff": {
                  "eligible": not failures,
                  "workflow": "publish_historical_archives.yml",
                  "github_artifact_is_staging_only": True,
              },
          }
          (root / "manifest.json").write_text(
              json.dumps(manifest, indent=2, sort_keys=True) + "\n", encoding="utf-8"
          )
          PY
      - name: Retain independent site evidence
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: foi-site-wayback-${{ matrix.site.id }}-${{ github.run_id }}
          retention-days: 90
          if-no-files-found: error
          include-hidden-files: true
          path: .tmp/sites/${{ matrix.site.id }}/
      - name: Fail closed on incomplete snapshot
        run: |
          uv run python - <<'PY'
          import json
          import os
          from pathlib import Path
          manifest = Path(".tmp/sites") / os.environ["SITE_ID"] / "manifest.json"
          payload = json.loads(manifest.read_text(encoding="utf-8"))
          if not payload["complete"]:
              raise SystemExit(f"Wayback snapshot incomplete: {payload['failures']}")
          PY
