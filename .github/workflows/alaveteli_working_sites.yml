name: Alaveteli working sites

on:
  schedule:
    # 01:00 UTC is overnight across SE, UA, GE, and UY; five requests/site.
    - cron: "0 1 * * *"
  workflow_dispatch:
    inputs:
      instance:
        description: Enabled registry instance to process, or all
        required: true
        default: all
        type: string
      dry_run:
        description: Deterministic no-network run
        required: true
        default: true
        type: boolean
      id_from:
        description: First request ID for the bounded fallback queue
        required: true
        default: 1
        type: number
      id_to:
        description: Last request ID for the bounded fallback queue
        required: true
        default: 5
        type: number
      request_ref:
        description: Optional explicit public request ID or slug for a capped smoke
        required: false
        type: string
      max_requests:
        description: Maximum captures per site
        required: true
        default: 5
        type: number
      min_interval:
        description: Minimum seconds between requests to the host
        required: true
        default: 60
        type: number

permissions:
  contents: read

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@94527f2e458b27549849d47d273a16bec83a01e9 # v7
      - name: Build validated automation matrix
        id: matrix
        env:
          SELECTED_INSTANCE: ${{ github.event_name == 'schedule' && 'all' || inputs.instance }}
        run: |
          set -euo pipefail
          policies="$(uv run --frozen python scripts/build_alaveteli_automation_matrix.py)"
          if [ "$SELECTED_INSTANCE" != "all" ] \
            && ! jq -e --arg selected "$SELECTED_INSTANCE" \
              '.include | any(.instance == $selected)' <<<"$policies" >/dev/null; then
            echo "Unknown or disabled automation instance: $SELECTED_INSTANCE" >&2
            exit 1
          fi
          matrix="$(jq -c '{include: [.include[] | {instance}]}' <<<"$policies")"
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"

  archive:
    needs: plan
    strategy:
      fail-fast: false
      # Different hosts progress independently; the reusable worker serializes
      # runs that target the same instance.
      max-parallel: 4
      matrix: ${{ fromJson(needs.plan.outputs.matrix) }}
    permissions:
      contents: read
      actions: read
    uses: ./.github/workflows/alaveteli_instance_capture.yml
    with:
      instance: ${{ matrix.instance }}
      enabled: ${{ github.event_name == 'schedule' || inputs.instance == 'all' || inputs.instance == matrix.instance }}
      dry_run: ${{ github.event_name != 'schedule' && inputs.dry_run }}
      use_registry_defaults: ${{ github.event_name == 'schedule' }}
      id_from: ${{ github.event_name == 'schedule' && 1 || inputs.id_from }}
      id_to: ${{ github.event_name == 'schedule' && 1 || inputs.id_to }}
      request_ref: ${{ github.event_name == 'schedule' && '' || inputs.request_ref }}
      max_requests: ${{ github.event_name == 'schedule' && 1 || inputs.max_requests }}
      min_interval: ${{ github.event_name == 'schedule' && 1 || inputs.min_interval }}
      discovery_max_pages: ${{ github.event_name == 'schedule' && 1 || 2 }}
